<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css.css">
    <title>Login & Register</title>
</head>

<body>
    <div class="wrapper">
        <div class="form-header">
            <div class="titles">
                <div class="title-login">Login</div>
                <span class="title-register">Register</span>
            </div>
        </div>
        <form action="#" class="login-form" autocomplate="off">
            <div class="input-box">
                <input type="text" class="input-field" id="log-email" required>
                <label for="log-email" class="label">Email</label>
                <i class="icon"><img src="assets/icons/envelope.svg" alt="Email icon"></i>
            </div>
            <div class="input-box">
                <input type="password" class="input-field" id="log-password" required>
                <label for="log-password" class="label">Password</label>
                <i class="icon"><img src="assets/icons/lock.svg" alt="Password icon"></i>
            </div>
            <div class="form-cols">
                <div class="col-1">
                </div>
                <div class="col-2">
                    <a href="#">Forgot Password?</a>
                </div>
            </div>
            <div class="input-box">
                <button class="btn-submit" id="SignInBtn">Sign In <img src="assets/icons/arrow-in-right-square-half.svg"
                        alt="Sign In Icon"></button>
            </div>
            <div class="switch-form">
                <span>Don't have an account? <a href="#" onclick="registerFunction()">Register</a></span>
            </div>

        </form>

        <form>
            <div class="register-form">
                <div class="input-box">
                    <input type="text" id="reg-user" class="input-field" autocomplete="off" required />
                    <label for="reg-user" class="label">Username</label>
                    <i class="icon"><img src="assets/icons/user.svg" alt="Email icon"></i>
                </div>
                <div class="input-box">
                    <input type="text" id="email" class="input-field" autocomplete="off" required />
                    <label for="email" class="label">Email</label>
                    <i class="icon"><img src="assets/icons/envelope.svg" alt="Email icon"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-pass" class="input-field" autocomplete="off" required />
                    <label for="reg-pass" class="label">Password</label>
                    <i class="icon"><img src="assets/icons/lock.svg" alt="Password icon"></i>
                </div>
                <div class="form-cols">
                    <div class="col-1">
                        <input type="checkbox" id="remember" />
                        <label for="remember"> I agree to the terms & condition</label>
                    </div>
                    <div class="col-2"></div>
                </div>
                <div class="input-box">
                    <button class="btn-submit" id="SignUpBtn">Sign Up <img src="assets/icons/arrow-in-left-square-half.svg"
                        alt="Sign Up Icon"></button>
                </div>
                <div class="switch-form">
                    <span>Already have an account?
                        <a href="#" onclick="loginFunction()">Login</a></span>
                </div>
            </div>
        </form>

    </div>
    <script src="assets/js.js"></script>
</body>

</html>
