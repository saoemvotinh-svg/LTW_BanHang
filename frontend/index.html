<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css.css">
    <title>Login & Register</title>
</head>

<body>
    <div class="container">
        <div class="wrapper">
            <div class="form-header">
                <div class="titles">
                    <div class="title-login">Login</div>
                </div>
                <form action="#" class="login-form" autocomplate="off">
                    <div class="input-box">
                        <input type="text" class="input-field" id="log-email">
                        <label for="log-email" class="label">Email</label>
                        <i class="email-icon"><img src="assets/icons/envelope.svg" alt="Email icon"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" class="input-field" id="log-password">
                        <label for="log-password" class="label">Password</label>
                        <i class="password-icon"><img src="assets/icons/lock.svg" alt="Password icon"></i>
                    </div>
                    <div class="form-cols">
                        <div class="col-1">
                        </div>
                        <div class="col-2">
                            <a href="#">Forgot Password?</a>
                        </div>
                    </div>
                    <div class="input-box">
                        <button class="btn-submit" id="SignInBtn">Sign In <img
                                src="assets/icons/arrow-in-right-square-half.svg" alt="Password icon"></button>
                    </div>
                    <div class="switch-form">
                        <span>Don't have an account? <a href="#">Register</a></span>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <script src="assets/js.js"></script>
</body>

</html>
