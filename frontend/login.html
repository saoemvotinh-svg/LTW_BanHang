<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <title>Login & Register</title>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="assets/images/logo.png" alt="ảnh logo">
            </div>
            <div class="title">
                <h1>My Website</h1>
            </div>
            <div class="account">
                <img src="assets/images/dog4.jpg" alt="avt">
                <p>Nguyễn Văn A</p>
            </div>
        </header>

        <div class="wrapper">

            <div class="form-header">
                <div class="titles">
                    <div class="title-login">Login</div>
                </div>
            </div>

            <form action="#" class="login-form" autocomplate="off">
                <div class="input-box">
                    <input type="text" class="input-field" id="log-email" required>
                    <label for="log-email" class="label">Email</label>
                    <i class="icon"><img src="assets/icons/envelope.svg" alt="Email icon"></i>
                </div>
                <div class="input-box">
                    <input type="password" class="input-field" id="log-password" required>
                    <label for="log-password" class="label">Password</label>
                    <i class="icon"><img src="assets/icons/lock.svg" alt="Password icon"></i>
                </div>
                <div class="form-cols">
                    <div class="col-1">
                    </div>
                    <div class="col-2">
                        <a href="#">Forgot Password?</a>
                    </div>
                </div>
                <div class="input-box">
                    <button class="btn-submit" id="SignInBtn">Sign In <img
                            src="assets/icons/arrow-in-right-square-half.svg" alt="Sign In Icon"></button>
                </div>
                <div class="switch-form">
                    <span>Don't have an account? <a href="#">Register</a></span>
                </div>
            </form>

        </div>

        <footer>
            chân trang
        </footer>

    </div>

    <script src="assets/script.js"></script>
</body>

</html>
