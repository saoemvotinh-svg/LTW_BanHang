<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm - Bảng điều khiển quản trị</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin-products.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/home.css">
</head>
<body>
  <header></header>
  <aside></aside>
  <main>
    <div class="products-container">
      <!-- HEADER -->
      <div class="page-header">
        <div class="page-title">
          <h1>Quản lý sản phẩm</h1>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="btnAddProduct">
            <i class="fa-solid fa-plus"></i> Thêm sản phẩm
          </button>
          <button class="btn btn-outline" onclick="location.reload()">
            <i class="fa-solid fa-rotate-right"></i> Làm mới
          </button>
        </div>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar">
        <div class="filter-group search-group">
          <label>Tìm kiếm</label>
          <div class="search-input">
            <input type="text" id="search-input" placeholder="Tên sản phẩm, mô tả...">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>

        <div class="filter-group">
          <label>Danh mục</label>
          <select id="category-filter">
            <option value="">Tất cả danh mục</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Trạng thái</label>
          <select id="stock-filter">
            <option value="">Tất cả</option>
            <option value="in_stock">Còn hàng</option>
            <option value="out_stock">Hết hàng</option>
          </select>
        </div>
      </div>

      <!-- DATA TABLE -->
      <div class="table-container">
        <table class="products-table">
          <thead>
            <tr>
              <th width="60">ID</th>
              <th width="80">Ảnh</th>
              <th>Tên sản phẩm</th>
              <th>Danh mục</th>
              <th>Giá (₫)</th>
              <th>Kho</th>
              <th>Đã bán</th>
              <th>Ngày tạo</th>
              <th width="120">Thao tác</th>
            </tr>
          </thead>
          <tbody id="products-tbody">
            <!-- Sản phẩm sẽ được render ở đây bằng JS -->
          </tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="pagination-bar">
        <div class="pagination-controls">
          <button class="btn-page"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="btn-page active">1</button>
          <button class="btn-page">2</button>
          <button class="btn-page">3</button>
          <button class="btn-page"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </div>
  </main>
  
  <!-- PRODUCT DETAILS OFFCANVAS -->
  <div class="offcanvas-overlay" id="offcanvas-overlay"></div>
  <div class="offcanvas" id="product-offcanvas">
    <div class="offcanvas-header">
      <h2>Chi tiết sản phẩm</h2>
      <button class="btn-close" id="btnCloseOffcanvas"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="offcanvas-body">
      <ul class="tabs">
        <li class="tab active" data-tab="info">Thông tin</li>
        <li class="tab" data-tab="images">Hình ảnh (<span id="images-count">0</span>)</li>
      </ul>
      
      <div class="tab-content active" id="tab-info">

        <div class="form-group">
          <label>Tên sản phẩm <span>*</span></label>
          <input type="text" id="p-name" value="Set bộ đồ chơi bé trai phong cách Hàn Quốc">
        </div>

        <div class="form-group">
          <label>Danh mục <span>*</span></label>
          <select id="p-category">
            <option>Thời trang bé trai</option>
            <option>Thời trang bé gái</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Giá bán (₫) <span>*</span></label>
            <input type="text" id="p-price" value="239000">
          </div>
          <div class="form-group">
            <label>Kho <span>*</span></label>
            <input type="number" id="p-stock" value="120">
          </div>
        </div>

        <div class="form-group">
          <label>Mô tả ngắn</label>
          <textarea id="p-desc" rows="3" placeholder="Mô tả sản phẩm..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Trạng thái</label>
            <select id="p-status" class="status-select">
              <option value="active" selected>Còn hàng</option>
              <option value="inactive">Hết hàng</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ngày tạo</label>
            <input type="text" disabled value="25/05/2024 10:30" class="disabled-input">
          </div>
      </div>
      </div>
      
      <!-- TAB HÌNH ẢNH -->
      <div class="tab-content" id="tab-images">
        <div class="image-management">
          
          <div class="primary-image-section">
            <h3>Ảnh chính</h3>
            <div id="primary-image-container" class="primary-image-wrapper">
               <!-- Sẽ render bằng JS -->
               <div class="empty-state">Chưa có ảnh chính</div>
            </div>
          </div>
          
          <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;" />
          
          <div class="gallery-images-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
              <h3>Ảnh phụ</h3>
              <div>
                <button type="button" class="btn btn-outline" id="btn-add-images">
                  <i class="fa-solid fa-plus"></i> Thêm ảnh
                </button>
                <input type="file" id="p-images-upload" multiple accept="image/jpeg,image/png,image/webp,image/gif" style="display:none">
              </div>
            </div>
            
            <div id="gallery-images-container" class="gallery-grid">
               <!-- Sẽ render bằng JS -->
            </div>
          </div>
          
        </div>
      </div>
    </div>
    
    <div class="offcanvas-footer">
      <button class="btn btn-outline" id="btnCancelOffcanvas">Hủy</button>
      <button class="btn btn-primary" id="btn-save-product">Lưu</button>
    </div>
  </div>
<footer></footer>
  <script src="../js/admin.js"></script>
  <script type="module" src="../js/admin-products.js"></script>
</body>
</html>
