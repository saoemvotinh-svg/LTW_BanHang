<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div data-include="../includes/header.html"></div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2 class="sidebar-title">Quản trị</h2>
      <nav>
        <a class="sidebar-link" href="admin-dashboard.html">Tổng quan</a>
        <a class="sidebar-link active" href="admin-products.html">Sản phẩm</a>
        <a class="sidebar-link" href="admin-form.html">Thêm/Sửa sản phẩm</a>
      </nav>
        <a class="sidebar-link" href="../index.html">Về trang chủ</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header row-between">
        <div>
          <h1>Quản lý sản phẩm</h1>
          <p>Danh sách sản phẩm hiện có.</p>
        </div>
        <a class="btn btn-primary" href="admin-form.html">+ Thêm sản phẩm</a>
      </header>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Hình ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div data-include="../includes/footer.html"></div>
  <script src="../js/admin.js"></script>
</body>
</html>
