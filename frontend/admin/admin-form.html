<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thêm/Sửa sản phẩm</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div data-include="../includes/header.html"></div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2 class="sidebar-title">Quản trị</h2>
      <nav>
        <a class="sidebar-link" href="admin-dashboard.html">Tổng quan</a>
        <a class="sidebar-link" href="admin-products.html">Sản phẩm</a>
        <a class="sidebar-link active" href="admin-form.html">Thêm/Sửa sản phẩm</a>
      </nav>
        <a class="sidebar-link" href="../index.html">Về trang chủ</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Thêm / Sửa sản phẩm</h1>
        <p>Nhập thông tin cơ bản để quản lý sản phẩm.</p>
      </header>

      <section class="panel">
        <form id="productForm" class="admin-form" action="#" method="post">
          <div class="form-group">
            <label for="productName">Tên sản phẩm</label>
            <input id="productName" type="text" placeholder="Nhập tên sản phẩm" required>
          </div>

          <div class="form-group two-col">
            <div>
              <label for="productCategory">Danh mục</label>
              <select id="productCategory" required>
                <option value="">Chọn danh mục</option>
                <option>Áo quần trẻ em</option>
                <option>Váy</option>
                <option>Đồ bộ</option>
              </select>
            </div>
            <div>
              <label for="productPrice">Giá (đ)</label>
              <input id="productPrice" type="number" min="0" placeholder="VD: 90000" required>
            </div>
          </div>

          <div class="form-group two-col">
            <div>
              <label for="productQty">Số lượng</label>
              <input id="productQty" type="number" min="0" placeholder="VD: 10" required>
            </div>
            <div>
              <label>Hình ảnh sản phẩm</label>
              <div style="display: flex; gap: 15px; margin-bottom: 8px;">
                <label style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
                  <input type="radio" name="uploadType" value="link" checked> Nhập link
                </label>
                <label style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
                  <input type="radio" name="uploadType" value="file"> Tải lên
                </label>
              </div>
              <input id="productImageLink" type="text" placeholder="Nhập link hình ảnh">
              <input id="productImageFile" type="file" accept="image/*" style="display: none; padding: 8px 12px; height: auto;">
              <small id="uploadHint" style="display: none; color: var(--muted); margin-top: 5px; font-size: 13px;">Sẽ được map ở: C:\Users\hung\Desktop\HKH\Web\Proj\Proj\frontend\assets\images\products</small>
            </div>
          </div>

          <div class="form-group">
            <label for="productDesc">Mô tả</label>
            <textarea id="productDesc" rows="5" placeholder="Mô tả ngắn về sản phẩm"></textarea>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Lưu sản phẩm</button>
            <a class="btn btn-cancel" href="admin-products.html">Hủy</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div data-include="../includes/footer.html"></div>
  <script src="../js/admin.js"></script>
</body>
</html>
